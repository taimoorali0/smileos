<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>SmileOS setup</title>
<style>
  body { margin: 0; font: 15px system-ui, sans-serif; background: #F3F6FB; color: #10265F; display: grid; place-items: center; height: 100vh; }
  form { background: #fff; border: 1px solid #D6DEEE; border-radius: 18px; padding: 32px; width: 420px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 24px; } p { margin: 0; color: #4A5B80; }
  input { padding: 12px; border: 1px solid #D6DEEE; border-radius: 10px; font: inherit; }
  button { padding: 12px; border: 0; border-radius: 10px; background: #0875F5; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .err { color: #D92D3A; min-height: 20px; }
</style>
</head>
<body>
<form id="f">
  <img src="build/icon.png" width="64" height="64" alt="">
  <h1>Connect to your clinic</h1>
  <p>Enter the address of your SmileOS server, for example http://192.168.1.20:4000 or https://smileos.yourclinic.com</p>
  <label for="u">Server address</label>
  <input id="u" required placeholder="http://192.168.1.20:4000" value="http://localhost:4000">
  <div class="err" id="e" role="alert"></div>
  <button>Connect</button>
</form>
<script>
  document.getElementById('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const r = await window.smileosDesktop.saveServer(document.getElementById('u').value.trim());
    if (!r.ok) document.getElementById('e').textContent = r.error;
  });
</script>
</body>
</html>
